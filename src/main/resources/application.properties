
spring.datasource.url=${DB_URL:jdbc:sqlserver://databaseintegradorproyect.database.windows.net:1433;database=proyectointegrador;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=never

server.port=8080
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.seed.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect